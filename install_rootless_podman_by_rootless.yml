- name: Install and Configure Podman with Podman Compose using pipx on Ubuntu 24.04
  hosts: all
  gather_facts: yes  # ansible_env を有効化
  tasks:
    - name: Get rootless user using whoami
      set_fact:
        rootless_user: "{{ lookup('pipe', 'whoami') }}"

    - name: Ensure pipx is in PATH
      shell: "pipx ensurepath"
      become: no

    - name: Install Podman Compose using pipx
      shell: "pipx install podman-compose"
      become: no

    - name: Create Podman config directory
      file:
        path: "/home/{{ rootless_user }}/.config/containers"
        state: directory
        mode: '0755'
      become: no

    - name: Copy registries.conf (Container Registry Configuration)
      copy:
        dest: "/home/{{ rootless_user }}/.config/containers/registries.conf"
        content: |
          [registries.search]
          registries = ['docker.io', 'quay.io', 'registry.fedoraproject.org']
      become: no

    - name: Configure Podman to use crun
      blockinfile:
        path: "/home/{{ rootless_user }}/.config/containers/containers.conf"
        create: yes
        block: |
          [engine]
          runtime = "crun"

    - name: Verify configuration (debug)
      command: podman info --format "{{ '{{' }}.Host.OCIRuntime.Name{{ '}}' }}"
      register: podman_runtime
      changed_when: false

    - name: Show configured runtime
      debug:
        msg: "Podman runtime is now set to '{{ podman_runtime.stdout }}'"

    - name: Run Podman system migrate 
      command: podman system migrate 
      changed_when: false

    - name: Verify Podman installation
      command: podman --version
      register: podman_version
      changed_when: false

    - name: Display Podman version
      debug:
        msg: "Podman installed: {{ podman_version.stdout }}"

    - name: Verify Podman Compose installation
      command: "/home/{{ rootless_user }}/.local/bin/podman-compose --version"
      become: no
      register: podman_compose_version
      changed_when: false

    - name: Display Podman Compose version
      debug:
        msg: "Podman Compose installed: {{ podman_compose_version.stdout }}"

    - name: Run a test container with Podman
      command: podman run --rm alpine echo "Podman is working!"
      become: no
      register: podman_test_output

    - name: Display test container output
      debug:
        msg: "{{ podman_test_output.stdout }}"
