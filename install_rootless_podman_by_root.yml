- name: Install and Configure Podman with Podman Compose using pipx on Ubuntu 24.04
  hosts: all
  become: yes
  gather_facts: yes  # ansible_env を有効化
  tasks:
    - name: Get rootless user using whoami
      set_fact:
        rootless_user: "{{ lookup('pipe', 'whoami') }}"
        rootless_user_uid: "{{ lookup('pipe', 'id -u') }}"
        rootless_runtime_dir: "/run/user/{{ lookup('pipe', 'id -u') }}"
        rootless_dbus_session_bus_address: "unix:path=/run/user/{{ lookup('pipe', 'id -u') }}/bus"
        subuid_file: /etc/subuid
        subgid_file: /etc/subgid
        default_range_start: 100000
        range_size: 65536 

    - name: Update package index
      apt:
        update_cache: yes

    - name: Install required packages (Podman, crun, pipx, and dependencies)
      apt:
        name:
          - podman
          - crun
          - fuse-overlayfs
          - pipx
          - python3-venv  # pipx の実行に必要
        state: present

    - name: Ensure pipx is in PATH
      shell: "pipx ensurepath"
      become: no

    - name: Install Podman Compose using pipx
      shell: "pipx install podman-compose"
      become: no

    - name: Enable lingering for rootless user
      command: loginctl enable-linger "{{ rootless_user }}"

    - name: Start systemd user manager for rootless user
      systemd:
        name: "user@{{ rootless_user_uid }}.service"
        state: started

    - name: Wait for rootless user D-Bus session bus
      wait_for:
        path: "{{ rootless_runtime_dir }}/bus"
        state: present
        timeout: 10

    - name: Verify rootless systemd user manager connection
      command: systemctl --user status --no-pager
      become: no
      environment:
        XDG_RUNTIME_DIR: "{{ rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "{{ rootless_dbus_session_bus_address }}"
      register: systemd_user_status
      changed_when: false

    - name: Enable podman-restart.service for rootless user
      command: systemctl --user enable podman-restart.service
      become: no
      environment:
        XDG_RUNTIME_DIR: "{{ rootless_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "{{ rootless_dbus_session_bus_address }}"

    - name: Read existing subuid content
      slurp:
        path: "{{ subuid_file }}"
      register: subuid_raw

    - name: Decode subuid lines
      set_fact:
        subuid_lines: "{{ subuid_raw.content | b64decode | split('\n')  | reject('equalto', '') | list }}"

    - name: Show subuid lines 
      debug:
        msg: "subuid_lines: {{ subuid_lines }}"

    - name: Calculate next available subuid range start
      set_fact:
        subuid_range_start: >-
          {{
            (
              subuid_lines
              | map('regex_search', ':(\d+):\d+$', '\1')
              | map('first')
              | map('int')
              + [default_range_start]
            ) | max + range_size 
          }}

    - name: Show subuid_range_start 
      debug:
        msg: "subuid_range_start: {{ subuid_range_start }}"

    - name: Check if subuid entry already exists for user
      shell: grep -E "^{{ rootless_user }}:" {{ subuid_file }} || true
      register: subuid_existing
      changed_when: false

    - name: Ensure /etc/subuid contains mapping for user
      lineinfile:
        path: "{{ subuid_file }}"
        regexp: "^{{ rootless_user }}:"
        line: "{{ rootless_user }}:{{ subuid_range_start }}:{{ range_size }}"
        create: yes
      when: subuid_existing.stdout == ""

    - name: Read existing subgid content
      slurp:
        path: "{{ subgid_file }}"
      register: subgid_raw

    - name: Decode subgid lines
      set_fact:
        subgid_lines: "{{ subgid_raw.content | b64decode | split('\n') | reject('equalto', '') | list }}"

    - name: Calculate next available subgid range start
      set_fact:
        subgid_range_start: >-
          {{
             (
              subgid_lines
              | map('regex_search', ':(\d+):\d+$', '\1')
              | map('first')
              | map('int')
              + [default_range_start]
            ) | max + range_size 
          }}

    - name: Check if subgid entry already exists for user
      shell: grep -E "^{{ rootless_user }}:" {{ subgid_file }} || true
      register: subgid_existing
      changed_when: false

    - name: Ensure /etc/subgid contains mapping for user
      lineinfile:
        path: "{{ subgid_file }}"
        regexp: "^{{ rootless_user }}:"
        line: "{{ rootless_user }}:{{ subgid_range_start }}:{{ range_size }}"
        create: yes
      when: subgid_existing.stdout == ""
