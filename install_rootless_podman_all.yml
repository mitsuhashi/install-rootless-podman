- name: Install and Configure Podman with Podman Compose using pipx on Ubuntu 24.04
  hosts: all
  become: yes
  gather_facts: yes  # ansible_env を有効化
  tasks:
    - name: Get rootless user using whoami
      set_fact:
        rootless_user: "{{ lookup('pipe', 'whoami') }}"
        rootless_user_uid: "{{ lookup('pipe', 'id -u') }}"
        rootless_user_gid: "{{ lookup('pipe', 'id -g') }}"
        subuid_file: /etc/subuid
        subgid_file: /etc/subgid
        default_range_start: 100000
        range_size: 65536 

    - name: Update package index
      apt:
        update_cache: yes

    - name: Install required packages (Podman, crun, pipx, and dependencies)
      apt:
        name:
          - podman
          - crun
          - pipx
          - python3-venv  # pipx の実行に必要
        state: present

    - name: Ensure pipx is in PATH
      shell: "pipx ensurepath"
      become: no

    - name: Install Podman Compose using pipx
      shell: "pipx install podman-compose"
      become: no

    - name: Ensure Podman service is enabled for rootless user
      command: loginctl enable-linger "{{ rootless_user }}"
      become: no  # Rootless user で実行

    - name: Read existing subuid content
      slurp:
        path: "{{ subuid_file }}"
      register: subuid_raw

    - name: Decode subuid lines
      set_fact:
        subuid_lines: "{{ subuid_raw.content | b64decode | split('\n')  | reject('equalto', '') | list }}"

    - name: Show subuid lines 
      debug:
        msg: "subuid_lines: {{ subuid_lines }}"

    - name: Calculate next available subuid range start
      set_fact:
        subuid_range_start: >-
          {{
            (
              subuid_lines
              | map('regex_search', ':(\d+):\d+$', '\1')
              | map('first')
              | map('int')
              + [default_range_start]
            ) | max + range_size 
          }}

    - name: Show subuid_range_start 
      debug:
        msg: "subuid_range_start: {{ subuid_range_start }}"

    - name: Check if subuid entry already exists for user
      shell: grep -E "^{{ rootless_user }}:" {{ subuid_file }} || true
      register: subuid_existing
      changed_when: false

    - name: Ensure /etc/subuid contains mapping for user
      lineinfile:
        path: "{{ subuid_file }}"
        regexp: "^{{ rootless_user }}:"
        line: "{{ rootless_user }}:{{ subuid_range_start }}:{{ range_size }}"
        create: yes
      when: subuid_existing.stdout == ""

    - name: Read existing subgid content
      slurp:
        path: "{{ subgid_file }}"
      register: subgid_raw

    - name: Decode subgid lines
      set_fact:
        subgid_lines: "{{ subgid_raw.content | b64decode | split('\n') | reject('equalto', '') | list }}"

    - name: Calculate next available subgid range start
      set_fact:
        subgid_range_start: >-
          {{
             (
              subgid_lines
              | map('regex_search', ':(\d+):\d+$', '\1')
              | map('first')
              | map('int')
              + [default_range_start]
            ) | max + range_size 
          }}

    - name: Check if subgid entry already exists for user
      shell: grep -E "^{{ rootless_user }}:" {{ subgid_file }} || true
      register: subgid_existing
      changed_when: false

    - name: Ensure /etc/subgid contains mapping for user
      lineinfile:
        path: "{{ subgid_file }}"
        regexp: "^{{ rootless_user }}:"
        line: "{{ rootless_user }}:{{ subgid_range_start }}:{{ range_size }}"
        create: yes
      when: subgid_existing.stdout == ""

    - name: Create Podman config directory
      file:
        path: "/home/{{ rootless_user }}/.config/containers"
        state: directory
        mode: '0755'
      become: no

    - name: Copy registries.conf (Container Registry Configuration)
      copy:
        dest: "/home/{{ rootless_user }}/.config/containers/registries.conf"
        content: |
          [registries.search]
          registries = ['docker.io', 'quay.io', 'registry.fedoraproject.org']
      become: no

    - name: Configure Podman to use crun
      blockinfile:
        path: "/home/{{ rootless_user }}/.config/containers/containers.conf"
        create: yes
        block: |
          [engine]
          runtime = "crun"

    - name: Verify configuration (debug)
      command: podman info --format "{{ '{{' }}.Host.OCIRuntime.Name{{ '}}' }}"
      register: podman_runtime
      changed_when: false

    - name: Show configured runtime
      debug:
        msg: "Podman runtime is now set to '{{ podman_runtime.stdout }}'"

    - name: Run Podman system migrate 
      command: podman system migrate 
      changed_when: false

    - name: Verify Podman installation
      command: podman --version
      register: podman_version
      changed_when: false

    - name: Display Podman version
      debug:
        msg: "Podman installed: {{ podman_version.stdout }}"

    - name: Verify Podman Compose installation
      command: "/home/{{ rootless_user }}/.local/bin/podman-compose --version"
      become: no
      register: podman_compose_version
      changed_when: false

    - name: Display Podman Compose version
      debug:
        msg: "Podman Compose installed: {{ podman_compose_version.stdout }}"

    - name: Run a test container with Podman
      command: podman run --rm alpine echo "Podman is working!"
      become: no
      register: podman_test_output

    - name: Display test container output
      debug:
        msg: "{{ podman_test_output.stdout }}"
